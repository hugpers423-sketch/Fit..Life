name: Deploy to Koyeb

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API
        run: docker build -t hugpers423/fitlife-api:${{ github.sha }} -f apps/api/Dockerfile .

      - name: Build Web
        run: docker build -t hugpers423/fitlife-web:${{ github.sha }} -f apps/web/Dockerfile .

      - name: Login to Docker Hub
        run: echo ${{ secrets.DOCKERHUB_TOKEN }} | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

      - name: Push API
        run: |
          docker push hugpers423/fitlife-api:${{ github.sha }}
          docker tag hugpers423/fitlife-api:${{ github.sha }} hugpers423/fitlife-api:latest
          docker push hugpers423/fitlife-api:latest

      - name: Push Web
        run: |
          docker push hugpers423/fitlife-web:${{ github.sha }}
          docker tag hugpers423/fitlife-web:${{ github.sha }} hugpers423/fitlife-web:latest
          docker push hugpers423/fitlife-web:latest
