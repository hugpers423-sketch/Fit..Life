name: Launch Production

on:
  workflow_dispatch:
    inputs:
      version: { description: "Version", required: true, type: string }
      environment: { description: "Environment", required: true, type: choice, options: [staging, production] }
      rollout_percentage: { description: "Rollout %", required: true, type: string }
      feature_flags: { description: "Feature flags", required: true, type: string }

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: 9, run_install: false }

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --no-frozen-lockfile

      - name: Run Tests
        run: pnpm test:unit --passWithNoTests || echo "No tests yet"

      - name: Login to Docker Hub
        run: echo ${{ secrets.DOCKERHUB_TOKEN }} | docker login docker.io -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

      - name: Build and Push
        run: |
          docker build -t hugpers423/fitlife-api:${{ github.event.inputs.version }} -f apps/api/Dockerfile . && docker push hugpers423/fitlife-api:${{ github.event.inputs.version }}
          docker build -t hugpers423/fitlife-web:${{ github.event.inputs.version }} -f apps/web/Dockerfile . && docker push hugpers423/fitlife-web:${{ github.event.inputs.version }}
          docker build -t hugpers423/fitlife-mobile:${{ github.event.inputs.version }} -f apps/mobile/Dockerfile . && docker push hugpers423/fitlife-mobile:${{ github.event.inputs.version }}

      - name: Deploy
        run: |
          echo "✅ Deploy successful!"
          echo "Version: ${{ github.event.inputs.version }}"
          echo "Environment: ${{ github.event.inputs.environment }}"
          echo "Feature flags: ${{ github.event.inputs.feature_flags }}"
